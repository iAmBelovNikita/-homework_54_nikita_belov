{% extends "base.html" %}

{% block nav %}
  <div class="d-flex gap-2">
    <a href="{% url 'products_view' %}" class="btn btn-primary">
      Products
    </a>

    <a href="{% url 'product_add_view' %}" class="btn btn-primary">
      Add Product
    </a>

    <a href="{% url 'category_add_view' %}" class="btn btn-outline-primary">
      Add Category
    </a>
  </div>
{% endblock %}

{% block content %}
  <div class="mt-4">
    <h2 class="mb-4">Add Category</h2>

    {% if error %}
      <div class="alert alert-danger">
        {{ error }}
      </div>
    {% endif %}

    {% include "partial/form.html" with button_text="Create" %}

  </div>
{% endblock %}
